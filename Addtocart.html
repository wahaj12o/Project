<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Order Pizza</title>
    <style>
    
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 900px;
    margin: 0 auto;
    display: flex; 
    gap: 20px;
}


.left-side {
    flex: 2; 
}

.box {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

.title {
    color: #d32f2f; 
}


.input-style {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 16px;
    display: block;
}


.right-side {
    flex: 1; 
}

.bill-box {
    background: #1a1a1a;
    color: white;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
}

.price-row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

.total {
    font-weight: bold;
    font-size: 20px;
    color: #ffcc00;
}

.order-btn {
    background-color: #d32f2f;
    color: white;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 5px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
}

.order-btn:hover {
    background-color: #b71c1c;
}

.back-link {
    display: block;
    margin-top: 15px;
    color: white;
    text-decoration: none;
    font-size: 14px;
}


@media (max-width: 600px) {<div id="orderModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 style="color: #d32f2f; text-align: center;">Apna Order Final Karein</h2>
        <hr>

        <label><b>Pizza Flavour:</b></label>
        <select id="flavour">
            <option>Arizona Cream</option>
            <option>Mexican Treat</option>
            <option>Chicken Tikka</option>
            <option>Cheese Lover</option>
        </select>

        <label><b>Size Pilih Karein:</b></label>
        <div class="size-options">
            <input type="radio" name="size" value="Small" id="s"> <label for="s">Small</label>
            <input type="radio" name="size" value="Medium" id="m" checked> <label for="m">Medium</label>
            <input type="radio" name="size" value="Large" id="l"> <label for="l">Large</label>
        </div>

        <input type="text" id="custName" placeholder="Aapka Naam" required>
        <input type="tel" id="custPhone" placeholder="Mobile Number" required>
        <textarea id="custAddress" placeholder="Mukammal Address (Ghar/Shop Number)" rows="3" required></textarea>

        <button class="confirm-btn" onclick="sendToWhatsApp()">Order on WhatsApp 🚀</button>
    </div>
</div>
    .container {
        flex-direction: column; 
    }
}
</style>
</head>
<body>

    <div class="container">
        <div class="left-side">
            <h2 class="title">Order Now</h2>
            
            <div class="box">
                <h3>1. Choose Your Flavour</h3>
                <select class="input-style">
                    <option>Arizona Cream</option>
                    <option>Mexican Treat</option>
                    <option>Chicken Tikka</option>
                    <option>Chicken Fajita</option>
                    <option>Cheese Lover</option>
                </select>
            </div>

            <div class="box">
                <h3>2. Delivery Details</h3>
                <input type="text" placeholder="Your Name" class="input-style">
                <input type="text" placeholder="Your Phone Number" class="input-style">
                <textarea placeholder="Your full address" class="input-style" rows="4"></textarea>
            </div>
        </div>

        <div class="right-side">
            <div class="bill-box">
                <h2>Total Bill</h2>
                <div class="price-row">
                    <span>Pizza Price:</span>
                    <span>Rs. 599</span>
                </div>
                <div class="price-row">
                    <span>Delivery Charges:</span>
                    <span>Rs. 100</span>
                </div>
                <hr>
                <div class="price-row total">
                    <span>Grand Total:</span>
                    <span>Rs. 699</span>
                </div>
                <button class="order-btn">Order Confirm Karein</button>
                <a href="index1.html" class="back-link">Menu Par Wapas Jayein</a>
            </div>
        </div>
    </div>

</body>
</html>
